name: Проверка навыка

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Проверка материалов (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bsl-unit-test
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Получить исходники
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: bsl-unit-test
      - name: Подготовить Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Установить средство проверки формата
        run: python -m pip install -r requirements-dev.txt
      - name: Проверить формат Agent Skills
        run: skills-ref validate "$PWD"
      - name: Проверить ссылки, сценарии и шаблоны
        run: python -X utf8 scripts/validate.py
